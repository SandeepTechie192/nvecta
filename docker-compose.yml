version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-ai-notes-app
    container_name: notes_app
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    environment:
      SERVICE_NAME: app
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: notes_db
      DB_USERNAME: notes_user
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: notes_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: notes_db
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: notes_redis
    ports:
      - "6379:6379"

volumes:
  dbdata:
    driver: local
